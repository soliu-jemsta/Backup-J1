# --- HTTP: ACME challenge + redirect everything to HTTPS ---
server {
    listen 80;
    server_name jemsta.co.uk www.jemsta.co.uk jemstauk.co.uk www.jemstauk.co.uk jemstauk.com www.jemstauk.com jemstarealestate.com www.jemstarealestate.com mortgage2match.co.uk www.mortgage2match.co.uk jemstaestateagency.com www.jemstaestateagency.com jemstaestateagency.co.uk www.jemstaestateagency.co.uk;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: jemsta.co.uk / jemstauk.co.uk -> Jemsta Group of Companies (UK), jemsta-groups ---
server {
    listen 443 ssl;
    server_name jemsta.co.uk www.jemsta.co.uk jemstauk.co.uk www.jemstauk.co.uk;
    ssl_certificate     /etc/letsencrypt/live/jemsta.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jemsta.co.uk/privkey.pem;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://jemsta-groups:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

