# --- LOCAL TESTING ONLY: HTTP-only routing, no SSL ---
# This mirrors nginx.conf's routing but skips the 443/SSL blocks,
# since Let's Encrypt certs can't be issued for a local machine.

server {
    listen 80;
    server_name jemsta.co.uk www.jemsta.co.uk;

    location / {
        proxy_pass http://jemsta-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.jemsta.co.uk;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name yournewdomain.com www.yournewdomain.com;

    location / {
        proxy_pass http://jemsta-frontend-ng:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
